<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,setPersistence,browserSessionPersistence,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,deleteDoc,onSnapshot,collection,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {FIREBASE_CONFIG,EMAIL_DOMAIN} from "./firebase-config.js";
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ACC={pns:'PNS',pppk:'PPPK',superadmin:'superadmin'},AK={PNS:['PNS'],PPPK:['PPPK'],superadmin:['PNS','PPPK']},SN={PNS:'CEKdataPNS',PPPK:'CEKdataPPPK'};
const S={u:null,cfg:null,cb:{},eb:{},rows:{PNS:[],PPPK:[]},edits:{},tab:'dash',fail:0,lock:0,imp:null,q:'',un:[]};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)};
const norm=v=>/tidak/i.test(v||'')?'Tidak Sesuai':/^\s*sesuai/i.test(v||'')?'Sesuai':'';
const eid=(sh,i)=>S.cfg.v+'_'+sh+'_'+i;
const ok=!String(FIREBASE_CONFIG.apiKey).startsWith('ISI');
const TH=()=>{try{return localStorage.getItem('tema')}catch(e){return null}};document.documentElement.dataset.theme=TH()||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
let auth,db;
if(ok){const app=initializeApp(FIREBASE_CONFIG);auth=getAuth(app);db=getFirestore(app);setPersistence(auth,browserSessionPersistence)}
const KN=['NIP','Kode Hubungan Keluarga','Nama','Status Kepegawaian','Gelar Depan','Gelar Belakang','Kode Jenis Kelamin','Tanggal Lahir','Kode Status Kawin','Tanggal Nikah','Tanggal Cerai','Tanggal Wafat','Tanggal SKS','Kolom Tambahan','TAT SKS','No SKS','Kode Tunjangan','NIP Suami/Istri','Waktu Update','Penginput Data','Pekerjaan','Kode Dati 1','Kode Dati 2','Kode SKPD','Nama SKPD'];
const lay=sh=>{const m=S.cfg.map[sh],rs=S.rows[sh].filter(Boolean).slice(0,60);return rs.length>0&&rs.filter(r=>/^\d{2}$/.test((r[m.nip+1]||'').trim())).length>=rs.length*.7};
const lab=(sh,j,ly)=>{const off=j-S.cfg.map[sh].nip;return ly&&off>=0&&off<KN.length?KN[off]:(S.cfg.headers[sh][j]||'').trim()||'Kolom '+L(j)};
function eff(sh,i){const m=S.cfg.map[sh],r=S.rows[sh][i]||[],e=S.edits[eid(sh,i)];return{st:norm(e?e.s:r[m.st]),ket:e?e.k:r[m.ket]||'',tel:e?e.t:r[m.tel]||'',e}}
function rebuild(){S.rows={PNS:[],PPPK:[]};if(S.cfg)Object.values(S.cb).flat().filter(c=>c.v===S.cfg.v).forEach(c=>c.rows.forEach((r,k)=>S.rows[c.sh][c.o+k]=JSON.parse(r)));if(S.cfg)['PNS','PPPK'].forEach(sh=>{if(S.cfg.map[sh]&&lay(sh))S.cfg.map[sh].nama=S.cfg.map[sh].nip+2});refresh()}
function refresh(){if(!S.u)return renderLogin();renderApp()}
const bad=e=>toast('Akses ditolak atau koneksi bermasalah: '+(e.code||e.message));
function subscribe(){S.un=[];S.cb={};S.eb={};S.edits={};
 S.un.push(onSnapshot(doc(db,'meta','cfg'),s=>{S.cfg=s.exists()?s.data():null;rebuild()},bad));
 AK[S.u.acc].forEach(sh=>{
  S.un.push(onSnapshot(query(collection(db,'base'),where('sh','==',sh)),q=>{S.cb[sh]=q.docs.map(d=>({id:d.id,...d.data()}));rebuild()},bad));
  S.un.push(onSnapshot(query(collection(db,'edits'),where('sh','==',sh)),q=>{S.eb[sh]=q.docs.map(d=>[d.id,d.data()]);S.edits={};Object.values(S.eb).forEach(a=>a.forEach(([k,v])=>S.edits[k]=v));if(!$('#res')?.contains(document.activeElement))refresh()},bad))})}
async function logout(msg){S.un.forEach(u=>u());S.un=[];S.u=null;S.cfg=null;S.q='';S.imp=null;sessionStorage.clear();clearTimeout(it);S.rows={PNS:[],PPPK:[]};S.edits={};try{await signOut(auth)}catch(e){}refresh();if(msg)toast(msg)}
let it;const bump=()=>{clearTimeout(it);if(S.u){sessionStorage.setItem('la',Date.now());it=setTimeout(()=>logout('Sesi berakhir karena tidak aktif 15 menit'),15*60000)}};['click','keydown','touchstart'].forEach(e=>addEventListener(e,bump));
function renderLogin(){ if(!ok){$('#app').innerHTML='<div class="card"><b>Pengaturan belum diisi.</b><br>Buka file <code>firebase-config.js</code> lalu isi sesuai PANDUAN (Langkah B5).</div>';return}
 document.body.classList.remove('on');document.body.classList.add('lg');$('#app').innerHTML=`<i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><div class="stage"><div class="tw" id="tw"></div><div class="login glass"><h2 style="margin:0">Masuk</h2><p class="lead">Data ini bersifat pribadi. Isi <b>nama asli penginput</b> agar admin dapat melihat siapa yang mengubah data.</p>
<div class="fld"><label>Nama lengkap penginput (nama asli) <span class="err">*</span></label><input type="text" id="ln" autocomplete="name" placeholder="Wajib diisi" required></div>
